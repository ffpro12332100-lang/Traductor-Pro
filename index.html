<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>NEO-TRANSLATE v4 // Quantum Neural Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.78);
            --card-border: rgba(0, 243, 255, 0.22);
            --primary-neon: #00f3ff;
            --secondary-neon: #a855f7;
            --accent-green: #10b981;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glow-primary: 0 0 18px rgba(0, 243, 255, 0.28);
            --glow-purple: 0 0 18px rgba(168, 85, 247, 0.28);
            --radius-main: 16px;
            --base-font-size: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(168, 85, 247, 0.14) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(0, 243, 255, 0.14) 0%, transparent 40%);
            padding: 16px 12px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 22px;
            margin-top: 10px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.7rem, 5vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #fff;
            text-shadow: 0 0 14px var(--primary-neon);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 span {
            color: var(--primary-neon);
        }

        header p {
            color: var(--text-dim);
            font-size: clamp(0.75rem, 2.2vw, 0.88rem);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .utility-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .util-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .util-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            user-select: none;
        }

        .util-btn:hover, .util-btn:active {
            border-color: var(--primary-neon);
            box-shadow: var(--glow-primary);
            color: var(--primary-neon);
        }

        .util-btn.btn-danger:hover, .util-btn.btn-danger:active {
            border-color: var(--danger-color);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
            color: var(--danger-color);
        }

        .translator-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-main);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65), var(--glow-primary);
            overflow: hidden;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3, 7, 18, 0.7);
            padding: 12px 20px;
            border-bottom: 1px solid var(--card-border);
            gap: 12px;
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .select-group.right {
            justify-content: flex-end;
        }

        select {
            background: rgba(15, 23, 42, 0.95);
            color: var(--primary-neon);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            width: 100%;
            max-width: 230px;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        select:hover, select:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.35);
        }

        .swap-btn {
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--primary-neon);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .swap-btn:hover, .swap-btn:active {
            background: var(--primary-neon);
            color: #030712;
            box-shadow: var(--glow-primary);
            transform: rotate(180deg);
        }

        .text-area-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
        }

        .input-box, .output-box {
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 260px;
            position: relative;
        }

        .input-box {
            border-right: 1px solid var(--card-border);
        }

        textarea {
            width: 100%;
            height: 170px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: var(--base-font-size);
            resize: none;
            line-height: 1.6;
        }

        textarea::placeholder {
            color: var(--text-dim);
            font-weight: 300;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-dim);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .icon-btn:hover, .icon-btn:active {
            color: var(--primary-neon);
            border-color: var(--primary-neon);
            background: rgba(0, 243, 255, 0.12);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .icon-btn.btn-delete:hover, .icon-btn.btn-delete:active {
            color: var(--danger-color) !important;
            border-color: var(--danger-color) !important;
            background: rgba(239, 68, 68, 0.15) !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3) !important;
        }

        .icon-btn.active-speaking {
            color: var(--primary-neon) !important;
            border-color: var(--primary-neon) !important;
            animation: pulse-glow 1.2s infinite alternate;
        }

        .icon-btn.recording {
            color: var(--danger-color) !important;
            border-color: var(--danger-color) !important;
            background: rgba(239, 68, 68, 0.15) !important;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--primary-neon); }
            100% { box-shadow: 0 0 15px var(--primary-neon); }
        }

        .info-counters {
            display: flex;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .status-indicator {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-neon);
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            z-index: 5;
        }

        .status-indicator.active {
            display: flex;
        }

        .spin-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-main);
            width: 100%;
            max-width: 650px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), var(--glow-primary);
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .modal-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--primary-neon);
        }

        .modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            border-color: var(--primary-neon);
            background: rgba(0, 0, 0, 0.2);
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .history-src {
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .history-tgt {
            color: var(--primary-neon);
            word-break: break-word;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--primary-neon);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            box-shadow: var(--glow-primary);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .dropdown-menu {
            position: absolute;
            bottom: 48px;
            left: 0;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px 14px;
            font-size: 0.8rem;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
        }

        .dropdown-item:hover {
            background: rgba(0, 243, 255, 0.15);
            color: var(--primary-neon);
        }

        @media (max-width: 768px) {
            .text-area-container {
                grid-template-columns: 1fr;
            }
            .input-box {
                border-right: none;
                border-bottom: 1px solid var(--card-border);
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            .select-group {
                flex: 1 1 42%;
            }
            select {
                max-width: 100%;
            }
            textarea {
                height: 130px;
            }
        }

        footer {
            margin-top: 25px;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-align: center;
            padding-bottom: 15px;
        }

        footer span {
            color: var(--primary-neon);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>NEO<span>TRANSLATE</span></h1>
            <p>Traducción Neuronal Multimotor // Sistema Ultrarrápido v4</p>
        </header>

        <div class="utility-bar">
            <div class="util-group">
                <button class="util-btn" id="btn-history">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Historial
                </button>
                <button class="util-btn" id="btn-speed-toggle" title="Cambiar velocidad de reproducción por voz">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                    Voz: <span id="speed-label">1.0x</span>
                </button>
            </div>

            <div class="util-group">
                <button class="util-btn" id="btn-font-dec" title="Reducir fuente">A-</button>
                <button class="util-btn" id="btn-font-inc" title="Aumentar fuente">A+</button>
            </div>
        </div>

        <div class="translator-box">
            <div class="controls">
                <div class="select-group">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <select id="source-lang" aria-label="Idioma de Origen">
                        <option value="autodetect">Detección Automática</option>
                        <option value="es">Español</option>
                        <option value="en">Inglés</option>
                        <option value="fr">Francés</option>
                        <option value="de">Alemán</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Portugués</option>
                        <option value="zh">Chino</option>
                        <option value="ja">Japonés</option>
                        <option value="ko">Coreano</option>
                        <option value="ru">Ruso</option>
                        <option value="ar">Árabe</option>
                        <option value="hi">Hindi</option>
                        <option value="nl">Holandés</option>
                        <option value="pl">Polaco</option>
                        <option value="tr">Turco</option>
                        <option value="uk">Ucraniano</option>
                    </select>
                </div>

                <button class="swap-btn" id="swap-languages" title="Intercambiar Idiomas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
                </button>

                <div class="select-group right">
                    <select id="target-lang" aria-label="Idioma de Destino">
                        <option value="en">Inglés</option>
                        <option value="es">Español</option>
                        <option value="fr">Francés</option>
                        <option value="de">Alemán</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Portugués</option>
                        <option value="zh">Chino</option>
                        <option value="ja">Japonés</option>
                        <option value="ko">Coreano</option>
                        <option value="ru">Ruso</option>
                        <option value="ar">Árabe</option>
                        <option value="hi">Hindi</option>
                        <option value="nl">Holandés</option>
                        <option value="pl">Polaco</option>
                        <option value="tr">Turco</option>
                        <option value="uk">Ucraniano</option>
                    </select>
                </div>
            </div>

            <div class="text-area-container">
                <!-- PANEL DE ENTRADA -->
                <div class="input-box">
                    <textarea id="input-text" placeholder="Escribe o dicta el texto aquí..." maxlength="15000" spellcheck="false"></textarea>
                    
                    <div class="action-bar">
                        <div class="action-btns" style="position: relative;">
                            <button class="icon-btn" id="btn-listen-input" title="Escuchar texto de entrada">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                            </button>
                            <button class="icon-btn" id="btn-mic" title="Dictar por voz (Micrófono)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                            </button>
                            <button class="icon-btn" id="btn-copy-input" title="Copiar texto de entrada">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                            <button class="icon-btn" id="btn-tools" title="Formatear texto">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                            </button>
                            <div class="dropdown-menu" id="tools-menu">
                                <button class="dropdown-item" id="tool-upper">MAYÚSCULAS</button>
                                <button class="dropdown-item" id="tool-lower">minúsculas</button>
                                <button class="dropdown-item" id="tool-title">Modo Título</button>
                                <button class="dropdown-item" id="tool-clean">Limpiar Espacios</button>
                                <button class="dropdown-item" id="tool-punctuate">Auto-Puntuación ❓</button>
                            </div>
                            <!-- Icono SVG Basura para Entrada -->
                            <button class="icon-btn btn-delete" id="btn-clear" title="Borrar entrada y salida">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                        <div class="info-counters">
                            <span>P: <strong id="word-num">0</strong></span>
                            <span><strong id="char-num">0</strong> / 15000</span>
                        </div>
                    </div>
                </div>

                <!-- PANEL DE SALIDA -->
                <div class="output-box">
                    <div class="status-indicator" id="status-text">
                        <svg class="spin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line></svg>
                        <span id="status-label">Traduciendo...</span>
                    </div>
                    <textarea id="output-text" placeholder="La traducción aparecerá aquí..." readonly></textarea>
                    
                    <div class="action-bar">
                        <div class="action-btns">
                            <button class="icon-btn" id="btn-listen-output" title="Escuchar traducción por voz">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                            </button>
                            <button class="icon-btn" id="btn-copy-output" title="Copiar traducción">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                            <!-- Icono SVG Basura para Salida -->
                            <button class="icon-btn btn-delete" id="btn-clear-output" title="Borrar traducción">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Traductor Neuronal Pro // <span>Motor Multicapa de Baja Latencia v4</span></p>
        </footer>
    </div>

    <!-- Modal de Historial -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Historial de Traducciones</h3>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="util-btn btn-danger" id="btn-clear-history" title="Borrar todo el historial">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Vaciar
                    </button>
                    <button class="icon-btn" id="btn-close-modal">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body" id="history-list"></div>
        </div>
    </div>

    <!-- Elemento Toast -->
    <div class="toast" id="toast-msg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <span id="toast-text">Notificación</span>
    </div>

    <script>
        // Referencias DOM
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const sourceLang = document.getElementById('source-lang');
        const targetLang = document.getElementById('target-lang');
        const swapBtn = document.getElementById('swap-languages');
        const charNum = document.getElementById('char-num');
        const wordNum = document.getElementById('word-num');
        const statusText = document.getElementById('status-text');
        const statusLabel = document.getElementById('status-label') || statusText;

        const btnListenInput = document.getElementById('btn-listen-input');
        const btnListenOutput = document.getElementById('btn-listen-output');
        const btnMic = document.getElementById('btn-mic');
        const btnCopyInput = document.getElementById('btn-copy-input');
        const btnCopyOutput = document.getElementById('btn-copy-output');
        const btnClear = document.getElementById('btn-clear');
        const btnClearOutput = document.getElementById('btn-clear-output');
        const btnTools = document.getElementById('btn-tools');
        const toolsMenu = document.getElementById('tools-menu');

        const btnHistory = document.getElementById('btn-history');
        const historyModal = document.getElementById('history-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnClearHistory = document.getElementById('btn-clear-history');
        const historyList = document.getElementById('history-list');

        const btnSpeedToggle = document.getElementById('btn-speed-toggle');
        const speedLabel = document.getElementById('speed-label');
        const btnFontInc = document.getElementById('btn-font-inc');
        const btnFontDec = document.getElementById('btn-font-dec');
        const toastMsg = document.getElementById('toast-msg');
        const toastText = document.getElementById('toast-text');

        // Estado y Caché en memoria para red ultralenta u offline
        let debounceTimer;
        let detectedLanguageCode = 'es';
        let isRecording = false;
        let recognition = null;
        let speechSpeed = 1.0;
        let currentFontSize = 16;
        let activeAbortController = null;
        let preMicText = ''; 
        
        // Memoria local ultrarrápida (Caché offline)
        const translationCache = new Map();
        let translationHistory = [];
        try {
            translationHistory = JSON.parse(localStorage.getItem('neo_trans_history') || '[]');
        } catch(e) {
            translationHistory = [];
        }

        // API de Voz con Fallback seguro
        const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;

        function setStatus(text, active = true) {
            if (statusLabel) statusLabel.textContent = text;
            if (active) statusText.classList.add('active');
            else statusText.classList.remove('active');
        }

        function showToast(msg) {
            toastText.textContent = msg;
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 2500);
        }

        // SISTEMA INTELIGENTE DE AUTO-PUNTUACIÓN Y GRAMÁTICA
        function applySmartPunctuation(str, lang = 'es') {
            if (!str || !str.trim()) return str;

            let text = str.trim();

            // 1. Mayúscula inicial
            text = text.charAt(0).toUpperCase() + text.slice(1);

            // 2. Colocar comas tras conectores habituales en español e inglés
            const connectorRegexEs = /\b(sin embargo|por lo tanto|además|por ejemplo|en efecto|por favor)\b(?!\s*,)/gi;
            text = text.replace(connectorRegexEs, '$1,');

            const connectorRegexEn = /\b(however|therefore|besides|for example|in fact|please)\b(?!\s*,)/gi;
            text = text.replace(connectorRegexEn, '$1,');

            // 3. Detección Inteligente de Preguntas (Español)
            const questionWordsEs = [
                'qué', 'que', 'cómo', 'como', 'cuándo', 'cuando', 'dónde', 'donde', 
                'por qué', 'porque', 'quién', 'quien', 'quiénes', 'quienes', 
                'cuál', 'cual', 'cuáles', 'cuales', 'cuánto', 'cuanto', 'cuántos', 
                'cuantas', 'para qué', 'acaso'
            ];

            const startsWithQuestionEs = questionWordsEs.some(q => 
                new RegExp('^' + q + '\\b', 'i').test(text) || 
                new RegExp('^¿\\s*' + q + '\\b', 'i').test(text)
            );

            if (startsWithQuestionEs) {
                if (!text.startsWith('¿')) text = '¿' + text;
                if (!text.endsWith('?') && !text.endsWith('.')) text += '?';
                else if (text.endsWith('.')) text = text.slice(0, -1) + '?';
            }

            // 4. Detección Inteligente de Preguntas (Inglés)
            const questionWordsEn = [
                'what', 'why', 'where', 'when', 'who', 'whom', 'how', 'which', 
                'can you', 'could you', 'would you', 'is it', 'are you', 'do you', 'does it'
            ];

            const startsWithQuestionEn = questionWordsEn.some(q => 
                new RegExp('^' + q + '\\b', 'i').test(text)
            );

            if (startsWithQuestionEn) {
                if (!text.endsWith('?') && !text.endsWith('.')) text += '?';
                else if (text.endsWith('.')) text = text.slice(0, -1) + '?';
            }

            return text;
        }

        // Inicialización optimizada de reconocimiento de voz
        if (!SpeechRecognition) {
            btnMic.style.opacity = '0.4';
            btnMic.title = 'Reconocimiento de voz no soportado por este navegador';
        } else {
            try {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isRecording = true;
                    btnMic.classList.add('recording');
                    preMicText = inputText.value.trim();
                    showToast('Escuchando voz...');
                };

                recognition.onresult = (event) => {
                    let transcriptResult = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcriptResult += event.results[i][0].transcript;
                    }

                    let combined = preMicText;
                    if (combined && !combined.endsWith(' ') && transcriptResult) {
                        combined += ' ';
                    }
                    combined += transcriptResult;

                    inputText.value = combined;
                    updateCounters();
                    triggerDebouncedTranslate();
                };

                recognition.onerror = (e) => {
                    isRecording = false;
                    btnMic.classList.remove('recording');
                    if (e.error === 'not-allowed') showToast('Permiso de micrófono denegado');
                };

                recognition.onend = () => {
                    isRecording = false;
                    btnMic.classList.remove('recording');
                    if (inputText.value.trim()) {
                        inputText.value = applySmartPunctuation(inputText.value, sourceLang.value);
                        updateCounters();
                        triggerDebouncedTranslate();
                    }
                };
            } catch (err) {
                console.warn('SpeechRecognition Init Fallback:', err);
            }
        }

        function updateCounters() {
            const val = inputText.value;
            charNum.textContent = val.length;
            const words = val.trim() ? val.trim().split(/\s+/).length : 0;
            wordNum.textContent = words;
        }

        inputText.addEventListener('input', () => {
            updateCounters();
            triggerDebouncedTranslate();
        });

        function triggerDebouncedTranslate() {
            clearTimeout(debounceTimer);
            if (!inputText.value.trim()) {
                outputText.value = '';
                setStatus('Traduciendo...', false);
                return;
            }

            setStatus('Traduciendo...', true);
            
            // Si el texto es gigante (>2500 chars), damos un debounce ligeramente mayor para evitar lag
            const waitTime = inputText.value.length > 2500 ? 550 : 300;
            debounceTimer = setTimeout(() => {
                translateText();
            }, waitTime);
        }

        sourceLang.addEventListener('change', () => { if(inputText.value.trim()) translateText(); });
        targetLang.addEventListener('change', () => { if(inputText.value.trim()) translateText(); });

        // INTERCAMBIO DE IDIOMAS CORREGIDO (SIN BORRAR EL TEXTO)
        swapBtn.addEventListener('click', () => {
            const currentInput = inputText.value;
            const currentOutput = outputText.value;

            if (!currentInput.trim() && !currentOutput.trim()) return;

            let currentSource = sourceLang.value;
            let currentTarget = targetLang.value;

            if (currentSource === 'autodetect') {
                currentSource = detectedLanguageCode || 'es';
            }

            const canAssignSource = Array.from(sourceLang.options).some(o => o.value === currentTarget);
            const canAssignTarget = Array.from(targetLang.options).some(o => o.value === currentSource);

            if (canAssignSource) sourceLang.value = currentTarget;
            if (canAssignTarget) targetLang.value = currentSource;

            if (currentOutput.trim()) {
                inputText.value = currentOutput;
                outputText.value = currentInput;
            }

            updateCounters();
            if (inputText.value.trim()) translateText();
        });

        // Fetch con timeout y reintentos automáticos para soportar las peores conexiones
        async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const combinedSignal = options.signal ? 
                    anySignal([options.signal, controller.signal]) : controller.signal;
                
                const response = await fetch(url, { ...options, signal: combinedSignal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        function anySignal(signals) {
            const controller = new AbortController();
            for (const signal of signals) {
                if (signal.aborted) {
                    controller.abort();
                    return signal;
                }
                signal.addEventListener('abort', () => controller.abort(), { once: true });
            }
            return controller.signal;
        }

        // DIVISOR INTELIGENTE PARA TEXTOS GIGANTES (+5000 Caracteres)
        function splitTextIntoChunks(text, maxChunkLen = 1200) {
            if (text.length <= maxChunkLen) return [text];

            const chunks = [];
            const paragraphs = text.split(/(\n+)/);
            let currentChunk = "";

            for (let part of paragraphs) {
                if ((currentChunk + part).length > maxChunkLen) {
                    if (currentChunk.trim()) {
                        chunks.push(currentChunk);
                        currentChunk = "";
                    }
                    if (part.length > maxChunkLen) {
                        // Dividir por frases
                        const sentences = part.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [part];
                        for (let sentence of sentences) {
                            if ((currentChunk + sentence).length > maxChunkLen) {
                                if (currentChunk.trim()) chunks.push(currentChunk);
                                currentChunk = sentence;
                            } else {
                                currentChunk += sentence;
                            }
                        }
                    } else {
                        currentChunk = part;
                    }
                } else {
                    currentChunk += part;
                }
            }
            if (currentChunk.trim()) chunks.push(currentChunk);
            return chunks.length > 0 ? chunks : [text];
        }

        // MOTOR INDIVIDUAL PARA UN FRAGMANTO DE TEXTO CON CUÁDRUPLE FALLBACK
        async function translateSingleChunk(textChunk, sLang, tLang, signal) {
            const subCacheKey = `${sLang}|${tLang}|${textChunk}`;
            if (translationCache.has(subCacheKey)) {
                return translationCache.get(subCacheKey);
            }

            // Motor 1: Google GTX Endpoint Directo
            try {
                const gUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sLang}&tl=${tLang}&dt=t&q=${encodeURIComponent(textChunk)}`;
                const response = await fetchWithTimeout(gUrl, { signal }, 5000);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0]) {
                        const translated = data[0].map(item => item[0]).filter(Boolean).join('');
                        if (data[2]) detectedLanguageCode = data[2].toLowerCase();
                        translationCache.set(subCacheKey, translated);
                        return translated;
                    }
                }
            } catch (e) {}

            // Motor 2: Google Chrome Client Fallback
            try {
                const gUrl2 = `https://translate.googleapis.com/translate_a/single?client=dict-chrome-ex&sl=${sLang}&tl=${tLang}&dt=t&q=${encodeURIComponent(textChunk)}`;
                const response = await fetchWithTimeout(gUrl2, { signal }, 5000);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0]) {
                        const translated = data[0].map(item => item[0]).filter(Boolean).join('');
                        translationCache.set(subCacheKey, translated);
                        return translated;
                    }
                }
            } catch (e) {}

            // Motor 3: Lingva Mirror Fallback
            try {
                const lUrl = `https://lingva.ml/api/v1/${sLang}/${tLang}/${encodeURIComponent(textChunk)}`;
                const response = await fetchWithTimeout(lUrl, { signal }, 5000);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.translation) {
                        translationCache.set(subCacheKey, data.translation);
                        return data.translation;
                    }
                }
            } catch (e) {}

            // Motor 4: MyMemory Backup
            try {
                const pair = (sLang === 'auto') ? `Autodetect|${tLang}` : `${sLang}|${tLang}`;
                const mUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(textChunk)}&langpair=${pair}`;
                const response = await fetchWithTimeout(mUrl, { signal }, 6000);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    const resText = data.responseData.translatedText;
                    translationCache.set(subCacheKey, resText);
                    return resText;
                }
            } catch (e) {}

            throw new Error("No network engine responded");
        }

        // MOTOR TRIPLE CON FRAGMENTACIÓN DE TEXTO Y CACHÉ LOCAL
        async function translateText() {
            const text = inputText.value.trim();
            if (!text) return;

            const sLang = sourceLang.value === 'autodetect' ? 'auto' : sourceLang.value;
            const tLang = targetLang.value;
            const cacheKey = `${sLang}|${tLang}|${text}`;

            // 1. Revisar Caché local para la frase completa
            if (translationCache.has(cacheKey)) {
                outputText.value = translationCache.get(cacheKey);
                setStatus('Traduciendo...', false);
                return;
            }

            setStatus('Traduciendo...', true);

            if (activeAbortController) {
                activeAbortController.abort();
            }
            activeAbortController = new AbortController();
            const signal = activeAbortController.signal;

            try {
                const chunks = splitTextIntoChunks(text, 1200);
                const translatedChunks = [];

                for (let i = 0; i < chunks.length; i++) {
                    if (signal.aborted) return;
                    
                    if (chunks.length > 1) {
                        setStatus(`Traduciendo (${i + 1}/${chunks.length})...`, true);
                    }

                    const translatedPart = await translateSingleChunk(chunks[i], sLang, tLang, signal);
                    translatedChunks.push(translatedPart);
                }

                if (signal.aborted) return;

                const fullTranslation = translatedChunks.join('');
                outputText.value = fullTranslation;
                translationCache.set(cacheKey, fullTranslation);
                saveToHistory(text, fullTranslation, sLang, tLang);

            } catch (error) {
                if (error.name !== 'AbortError') {
                    if (!navigator.onLine) {
                        outputText.value = "[Modo Sin Conexión] Sin acceso a la red de traducción.";
                        showToast("Comprueba tu conexión a internet");
                    } else {
                        outputText.value = "Conexión inestable. Reintentando la traducción...";
                    }
                }
            } finally {
                if (!signal.aborted) {
                    setStatus('Traduciendo...', false);
                }
            }
        }

        // REPRODUCCIÓN DE VOZ DE ALTA CAPACIDAD (Soporta Textos Extensos sin Cortarse)
        function speakText(text, langCode, buttonElement) {
            if (!text || !text.trim()) {
                showToast("No hay texto para escuchar");
                return;
            }

            if (!synth) {
                showToast("Síntesis de voz no disponible");
                return;
            }

            try {
                if (synth.speaking) synth.cancel();

                const targetLanguage = (langCode === 'autodetect' || langCode === 'auto') 
                    ? (detectedLanguageCode || 'es') 
                    : langCode;

                // Dividir en frases para evitar que la API TTS corte el audio en textos largos
                const sentences = text.match(/[^.!?\n]+[.!?\n]+/g) || [text];
                let currentSentenceIndex = 0;

                if (buttonElement) buttonElement.classList.add('active-speaking');

                function speakNextSentence() {
                    if (currentSentenceIndex >= sentences.length) {
                        if (buttonElement) buttonElement.classList.remove('active-speaking');
                        return;
                    }

                    const sentenceText = sentences[currentSentenceIndex].trim();
                    if (!sentenceText) {
                        currentSentenceIndex++;
                        speakNextSentence();
                        return;
                    }

                    const utterance = new SpeechSynthesisUtterance(sentenceText);
                    utterance.lang = targetLanguage;
                    utterance.rate = speechSpeed;

                    utterance.onend = () => {
                        currentSentenceIndex++;
                        speakNextSentence();
                    };

                    utterance.onerror = () => {
                        if (buttonElement) buttonElement.classList.remove('active-speaking');
                    };

                    synth.speak(utterance);
                }

                speakNextSentence();

            } catch (e) {
                if (buttonElement) buttonElement.classList.remove('active-speaking');
            }
        }

        btnListenInput.addEventListener('click', () => speakText(inputText.value, sourceLang.value, btnListenInput));
        btnListenOutput.addEventListener('click', () => speakText(outputText.value, targetLang.value, btnListenOutput));

        btnMic.addEventListener('click', () => {
            if (!recognition) {
                showToast("Micrófono no soportado en este navegador");
                return;
            }

            try {
                if (isRecording) {
                    recognition.stop();
                } else {
                    recognition.lang = sourceLang.value === 'autodetect' ? 'es-ES' : sourceLang.value;
                    recognition.start();
                }
            } catch (e) {
                isRecording = false;
                btnMic.classList.remove('recording');
            }
        });

        btnSpeedToggle.addEventListener('click', () => {
            if (speechSpeed === 1.0) speechSpeed = 0.8;
            else if (speechSpeed === 0.8) speechSpeed = 0.5;
            else speechSpeed = 1.0;

            speedLabel.textContent = `${speechSpeed}x`;
            showToast(`Velocidad de voz: ${speechSpeed}x`);
        });

        function copyText(text) {
            if (!text.trim()) return;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast("¡Texto copiado!")).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("¡Texto copiado!");
            } catch (err) {
                showToast("Error al copiar texto");
            }
            document.body.removeChild(textArea);
        }

        btnCopyInput.addEventListener('click', () => copyText(inputText.value));
        btnCopyOutput.addEventListener('click', () => copyText(outputText.value));

        // Menú de Herramientas de texto
        btnTools.addEventListener('click', (e) => {
            e.stopPropagation();
            toolsMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => toolsMenu.classList.remove('show'));

        document.getElementById('tool-upper').addEventListener('click', () => {
            inputText.value = inputText.value.toUpperCase();
            triggerDebouncedTranslate();
        });

        document.getElementById('tool-lower').addEventListener('click', () => {
            inputText.value = inputText.value.toLowerCase();
            triggerDebouncedTranslate();
        });

        document.getElementById('tool-title').addEventListener('click', () => {
            inputText.value = inputText.value.replace(/\w\S*/g, (w) => w.replace(/^\w/, (c) => c.toUpperCase()));
            triggerDebouncedTranslate();
        });

        document.getElementById('tool-clean').addEventListener('click', () => {
            inputText.value = inputText.value.replace(/\s+/g, ' ').trim();
            updateCounters();
            triggerDebouncedTranslate();
        });

        // Opción inteligente manual de Auto-Puntuación ❓
        document.getElementById('tool-punctuate').addEventListener('click', () => {
            if (inputText.value.trim()) {
                inputText.value = applySmartPunctuation(inputText.value, sourceLang.value);
                updateCounters();
                triggerDebouncedTranslate();
                showToast("Puntuación inteligente aplicada");
            }
        });

        // Controles de Tamaño de Texto
        btnFontInc.addEventListener('click', () => {
            if (currentFontSize < 24) {
                currentFontSize += 2;
                inputText.style.fontSize = `${currentFontSize}px`;
                outputText.style.fontSize = `${currentFontSize}px`;
            }
        });

        btnFontDec.addEventListener('click', () => {
            if (currentFontSize > 12) {
                currentFontSize -= 2;
                inputText.style.fontSize = `${currentFontSize}px`;
                outputText.style.fontSize = `${currentFontSize}px`;
            }
        });

        // Acciones de borrado con basureros SVG
        btnClear.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            updateCounters();
            setStatus('Traduciendo...', false);
            if (synth) synth.cancel();
        });

        btnClearOutput.addEventListener('click', () => {
            outputText.value = '';
            if (synth) synth.cancel();
        });

        // Historial con persistencia segura
        function saveToHistory(srcText, tgtText, sL, tL) {
            if (!srcText.trim() || srcText.length < 2) return;
            if (translationHistory.length > 0 && translationHistory[0].srcText === srcText) return;

            translationHistory.unshift({ 
                srcText, 
                tgtText, 
                sL, 
                tL, 
                date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });

            if (translationHistory.length > 30) translationHistory.pop();
            try {
                localStorage.setItem('neo_trans_history', JSON.stringify(translationHistory));
            } catch(e) {}
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if (translationHistory.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 20px;">No hay historial guardado aún.</p>';
                return;
            }

            translationHistory.forEach(item => {
                const el = document.createElement('div');
                el.className = 'history-item';
                el.innerHTML = `
                    <div class="history-meta">
                        <span>${item.sL.toUpperCase()} ➔ ${item.tL.toUpperCase()}</span>
                        <span>${item.date}</span>
                    </div>
                    <div class="history-src">${item.srcText}</div>
                    <div class="history-tgt">${item.tgtText}</div>
                `;
                el.addEventListener('click', () => {
                    inputText.value = item.srcText;
                    outputText.value = item.tgtText;
                    updateCounters();
                    historyModal.classList.remove('open');
                });
                historyList.appendChild(el);
            });
        }

        btnHistory.addEventListener('click', () => {
            renderHistory();
            historyModal.classList.add('open');
        });

        // Vaciar todo el historial por completo
        btnClearHistory.addEventListener('click', () => {
            if (translationHistory.length === 0) return;
            translationHistory = [];
            try {
                localStorage.removeItem('neo_trans_history');
            } catch(e) {}
            renderHistory();
            showToast("Historial eliminado por completo");
        });

        btnCloseModal.addEventListener('click', () => historyModal.classList.remove('open'));
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) historyModal.classList.remove('open');
        });
    </script>
</body>
</html>
